# ESPHome Air Quality Monitor
# Hardware: ESP32 + PMS5003 + MH-Z19 + BME280
# Features: PM2.5, PM10, CO2, Temperature, Humidity

substitutions:
  device_name: "air-quality-bedroom"
  friendly_name: "Bedroom Air Quality"

packages:
  base: !include common/base.yaml

# I2C for BME280
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# UART for PMS5003 (PM sensor)
uart:
  - id: uart_pms
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600

  # UART for MH-Z19 (CO2 sensor)
  - id: uart_mhz
    rx_pin: GPIO18
    tx_pin: GPIO19
    baud_rate: 9600

sensor:
  # PMS5003 Particulate Matter Sensor
  - platform: pmsx003
    type: PMSX003
    uart_id: uart_pms
    pm_1_0:
      name: "${friendly_name} PM1.0"
    pm_2_5:
      name: "${friendly_name} PM2.5"
      id: pm25
    pm_10_0:
      name: "${friendly_name} PM10"

  # MH-Z19 CO2 Sensor
  - platform: mhz19
    uart_id: uart_mhz
    co2:
      name: "${friendly_name} CO2"
      id: co2
    temperature:
      name: "${friendly_name} MH-Z19 Temp"
      internal: true
    update_interval: 60s
    automatic_baseline_calibration: false

  # BME280 Temperature & Humidity
  - platform: bme280_i2c
    temperature:
      name: "${friendly_name} Temperature"
      id: temp
    humidity:
      name: "${friendly_name} Humidity"
      id: humidity
    pressure:
      name: "${friendly_name} Pressure"
    address: 0x76
    update_interval: 60s

  # Air Quality Index (AQI) calculation
  - platform: template
    name: "${friendly_name} AQI"
    id: aqi
    unit_of_measurement: "AQI"
    icon: "mdi:air-filter"
    lambda: |-
      float pm = id(pm25).state;
      // Simplified AQI calculation for PM2.5
      if (pm <= 12.0) return pm * 50.0 / 12.0;
      if (pm <= 35.4) return 50 + (pm - 12.0) * 50.0 / 23.4;
      if (pm <= 55.4) return 100 + (pm - 35.4) * 50.0 / 20.0;
      if (pm <= 150.4) return 150 + (pm - 55.4) * 50.0 / 95.0;
      if (pm <= 250.4) return 200 + (pm - 150.4) * 100.0 / 100.0;
      return 300 + (pm - 250.4) * 100.0 / 149.6;
    update_interval: 60s

text_sensor:
  # Air Quality Category
  - platform: template
    name: "${friendly_name} Air Quality"
    lambda: |-
      float aqi = id(aqi).state;
      if (aqi <= 50) return {"Good"};
      if (aqi <= 100) return {"Moderate"};
      if (aqi <= 150) return {"Unhealthy for Sensitive"};
      if (aqi <= 200) return {"Unhealthy"};
      if (aqi <= 300) return {"Very Unhealthy"};
      return {"Hazardous"};
    update_interval: 60s

  # CO2 Level Category
  - platform: template
    name: "${friendly_name} CO2 Level"
    lambda: |-
      float co2_val = id(co2).state;
      if (co2_val < 800) return {"Excellent"};
      if (co2_val < 1000) return {"Good"};
      if (co2_val < 1500) return {"Fair"};
      if (co2_val < 2000) return {"Poor"};
      return {"Very Poor"};
    update_interval: 60s

# Optional: LED indicator for air quality
output:
  - platform: ledc
    pin: GPIO25
    id: led_output

light:
  - platform: monochromatic
    name: "${friendly_name} Status LED"
    output: led_output
    id: status_led
