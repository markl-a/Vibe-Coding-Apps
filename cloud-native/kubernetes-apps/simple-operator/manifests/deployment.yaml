apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-operator
  namespace: default
  labels:
    app: simple-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-operator
  template:
    metadata:
      labels:
        app: simple-operator
    spec:
      serviceAccountName: simple-operator
      containers:
        - name: operator
          image: simple-operator:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: simple-operator
rules:
  # AppConfig custom resources
  - apiGroups:
      - vibe.example.com
    resources:
      - appconfigs
      - appconfigs/status
    verbs:
      - get
      - list
      - watch
      - patch
  # ConfigMaps
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simple-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: simple-operator
subjects:
  - kind: ServiceAccount
    name: simple-operator
    namespace: default
