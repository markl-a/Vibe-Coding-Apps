<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>WebXR AR Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a2e;
        color: white;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        pointer-events: none;
        z-index: 100;
      }

      #instructions {
        background: rgba(0, 0, 0, 0.7);
        padding: 15px 20px;
        border-radius: 10px;
        text-align: center;
        max-width: 400px;
        margin: 0 auto;
      }

      #instructions h2 {
        font-size: 18px;
        margin-bottom: 8px;
      }

      #instructions p {
        font-size: 14px;
        opacity: 0.8;
      }

      #object-count {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 100;
      }

      .info-panel {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        padding: 15px 25px;
        border-radius: 10px;
        text-align: center;
        z-index: 100;
      }

      /* Non-AR fallback screen */
      #fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
      }

      #fallback h1 {
        font-size: 28px;
        margin-bottom: 20px;
      }

      #fallback p {
        font-size: 16px;
        opacity: 0.8;
        max-width: 500px;
        line-height: 1.6;
      }

      #fallback .icon {
        font-size: 80px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <div id="instructions">
        <h2>📱 WebXR AR Viewer</h2>
        <p>Point your camera at a flat surface and tap to place 3D objects</p>
      </div>
    </div>

    <div id="object-count">Objects: 0</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
