[pytest]
# Pytest 配置文件

# 測試文件搜索模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 測試目錄
testpaths = tests

# 標記定義
markers =
    unit: 單元測試 - 測試單個函數或類
    integration: 集成測試 - 測試多個組件的交互
    slow: 慢速測試 - 執行時間較長的測試
    api: API 測試 - 測試外部 API 調用
    cache: 緩存測試 - 測試緩存功能

# 輸出選項
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra

# 最小 Python 版本
minversion = 7.0

# 測試覆蓋率設置
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
